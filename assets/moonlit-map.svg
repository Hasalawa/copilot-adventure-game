<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Moonlit map over a winding adventure path</title>
  <desc id="desc">A navy night sky, a glowing moon, mountains, and a golden path leading to three destinations.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1735"/>
      <stop offset="0.55" stop-color="#172653"/>
      <stop offset="1" stop-color="#3b2858"/>
    </linearGradient>
    <linearGradient id="path" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#ffe8a3"/>
      <stop offset="1" stop-color="#e9a84b"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="420" rx="28" fill="url(#sky)"/>
  <circle cx="990" cy="88" r="52" fill="#ffe8a3" opacity=".2" filter="url(#glow)"/>
  <circle cx="990" cy="88" r="35" fill="#fff1bd"/>
  <circle cx="1004" cy="77" r="35" fill="#172653"/>
  <g fill="#fff1bd" opacity=".9">
