    <circle cx="651" cy="284" r="13"/><circle cx="600" cy="407" r="13"/>
  </g>
  <g font-family="Georgia, serif" fill="#fff1bd">
    <text x="74" y="322" font-size="20" letter-spacing="4">MOONLIT MAP</text>
    <text x="74" y="350" font-size="14" opacity=".75">A CHOOSE-YOUR-OWN ADVENTURE</text>
