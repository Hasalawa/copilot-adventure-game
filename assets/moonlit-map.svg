    <circle cx="308" cy="68" r="3"/><circle cx="454" cy="111" r="2"/>
    <circle cx="592" cy="50" r="3"/><circle cx="760" cy="95" r="2"/>
    <circle cx="850" cy="40" r="2"/><circle cx="1100" cy="165" r="3"/>
  </g>
  <path d="M0 305 170 173l95 74 126-119 130 113 122-159 150 180 120-86 167 129v115H0Z" fill="#101a3a"/>
  <path d="M0 344 210 240l115 62 130-84 156 96 125-55 146 86 112-42 206 70v47H0Z" fill="#0a122c"/>
  <path d="M600 420 C592 357 672 335 651 284 C628 230 545 231 502 201 C456 168 500 139 548 147" fill="none" stroke="#e9a84b" stroke-width="16" stroke-linecap="round" opacity=".3"/>
  <path d="M600 420 C592 357 672 335 651 284 C628 230 545 231 502 201 C456 168 500 139 548 147" fill="none" stroke="url(#path)" stroke-width="8" stroke-linecap="round"/>
  <g fill="#ffe8a3" stroke="#172653" stroke-width="4">
