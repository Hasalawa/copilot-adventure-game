name: Pull request triage

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, converted_to_draft, ready_for_review]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  triage:
    name: Label pull request
    runs-on: ubuntu-latest
    steps:
      - name: Apply pull request labels
        uses: actions/github-script@v7
        with:
          script: |
            const pullRequest = context.payload.pull_request;
            const text = `${pullRequest.title}\n${pullRequest.body || ""}`.toLowerCase();
            const labels = new Set(["needs-review"]);

            if (/\bbug\b|error|fail|broken|crash|exception/.test(text)) {
              labels.add("bug");
            }
            if (/\bfeature\b|enhancement|request|suggest|add\b/.test(text)) {
              labels.add("enhancement");
            }
            if (/readme|documentation|docs?\b|typo/.test(text)) {
              labels.add("documentation");
            }
            if (/security|vulnerab|exploit|secret|credential/.test(text)) {
              labels.add("security");
            }
            if (pullRequest.draft) {
              labels.add("draft");
            }

            const managedLabels = ["bug", "enhancement", "documentation", "security", "draft"];
            for (const label of managedLabels) {
              if (!labels.has(label)) {
                try {
                  await github.rest.issues.removeLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: pullRequest.number,
                    name: label,
                  });
                } catch (error) {
                  if (error.status !== 404) {
                    throw error;
                  }
                }
              }
            }

            for (const label of labels) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label,
                });
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label,
                  color: label === "security" ? "b60205" : "ededed",
                });
              }
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pullRequest.number,
              labels: [...labels],
            });
